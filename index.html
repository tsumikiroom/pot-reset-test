<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>pot-reset 試作 — 壺をつくる</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f3ef; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hint { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 28px); text-align: center;
          color: #8a8984; font-size: 14px; letter-spacing: .08em; pointer-events: none; transition: opacity .6s; }
  #swatches { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 22px);
              display: flex; justify-content: center; gap: 14px; }
  #swatches button { width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
                     outline: 2px solid transparent; outline-offset: 3px; }
  #swatches button.on { outline-color: #b9b8b2; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">ふちを指で押す・引く</div>
<div id="swatches"></div>
<script>
(() => {
  // 色の組み合わせ（A → B）。angle はグラデーションの向き（0 = 左→右）、lo/hi は2色が混ざる帯の位置
  const PRESETS = [
    { a: '#2ed6d2', b: '#2e3fd8', angle: -0.5, lo: 0.30, hi: 0.95 },  // シアン → 青
    { a: '#ffad00', b: '#e8559a', angle: 0.9,  lo: 0.25, hi: 0.90 },  // オレンジ → ピンク
    { a: '#2f3fd6', b: '#1f1f1d', angle: 0.2,  lo: 0.35, hi: 0.95 },  // 青 → 黒
    { a: '#ffffff', b: '#2ed6d2', angle: 0.1,  lo: 0.05, hi: 0.70 },  // 白 × シアン
  ];
  const BG = hex('#f4f3ef');
  const N = 160;                 // 輪郭の分割数（高さ方向）
  const radius = new Float32Array(N);

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  let W = 0, H = 0, S = 1;       // CSS px と描画倍率
  let img, buf;                  // 画面全体の画素
  let top, bottom, cx, rMin, rMax;
  let preset = PRESETS[Math.floor(Math.random() * PRESETS.length)];
  let dirty = true, prevBox = null;

  // 網点の間隔（CSS px）と、色の混ぜ具合の段数
  const PITCH = 2.6, MIXN = 64;
  // 濃さ t → 網点のしきい値。点の面積が t にちょうど比例するように、マス目を細かく調べて作る
  const THRN = 256, THR = new Float32Array(THRN);
  {
    const G = 128, vals = [];
    for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
      const x = (i + 0.5) / G * 2 - 1, y = (j + 0.5) / G * 2 - 1, ax = Math.abs(x), ay = Math.abs(y);
      vals.push(ax + ay <= 1 ? 1 - (x * x + y * y) : (ax - 1) * (ax - 1) + (ay - 1) * (ay - 1) - 1);
    }
    vals.sort((a, b) => b - a);
    for (let k = 0; k < THRN; k++) {
      const t = k / (THRN - 1);
      THR[k] = t <= 0 ? 1.01 : t >= 1 ? -1.01 : vals[Math.min(vals.length - 1, Math.floor(t * vals.length))];
    }
  }

  // 回転: phase（ラジアン）が時間で増える。SPIN は1秒あたりの回転量
  const SPIN = 1.6;
  let phase = 0, lastT = 0;
  const TILT = 0.12;                // 見下ろす角度（網点の行の弧の深さ）
  // 計算を軽くする asin の表
  const AN = 2048, ASIN = new Float32Array(AN);
  for (let i = 0; i < AN; i++) ASIN[i] = Math.asin(i / (AN - 1) * 2 - 1);

  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function pack([r, g, b]) { return (255 << 24) | (b << 16) | (g << 8) | r; }  // little-endian RGBA

  function layout() {
    if (!innerWidth || !innerHeight) return;
    const oldW = W;
    W = innerWidth; H = innerHeight;
    S = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(W * S); cv.height = Math.round(H * S);
    img = ctx.createImageData(cv.width, cv.height);
    buf = new Uint32Array(img.data.buffer);
    buf.fill(pack(BG));
    prevBox = null;
    const potH = Math.min(H * 0.6, W * 1.5);
    top = H * 0.48 - potH / 2; bottom = top + potH;
    cx = W / 2;
    rMin = W * 0.035; rMax = W * 0.46;
    if (!oldW) radius.fill(Math.min(W * 0.2, potH * 0.3));          // 最初は筒
    else for (let i = 0; i < N; i++) radius[i] *= W / oldW;
    dirty = true;
  }

  // 高さ y（CSS px）での半径（線形補間）
  function rAt(y) {
    const f = (y - top) / (bottom - top) * (N - 1);
    if (f <= 0) return radius[0];
    if (f >= N - 1) return radius[N - 1];
    const i = Math.floor(f), t = f - i;
    return radius[i] * (1 - t) + radius[i + 1] * t;
  }

  // 指が横に動いた分だけ、その高さの周りをなめらかに押す・引く
  function push(y, target) {
    const f = (y - top) / (bottom - top) * (N - 1);
    const d = target - rAt(y);
    if (Math.abs(d) < 0.01) return;
    const sigma = N * 0.075;
    for (let i = 0; i < N; i++) {
      const w = Math.exp(-((i - f) ** 2) / (2 * sigma * sigma));
      if (w < 0.002) continue;
      radius[i] = Math.min(rMax, Math.max(rMin, radius[i] + d * w));
    }
    dirty = true;
  }

  // ---- 指 ----
  const pointers = new Map();
  cv.addEventListener('pointerdown', e => {
    if (e.clientY < top - 30 || e.clientY > bottom + 30) return;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    hint.style.opacity = 0;
  });
  cv.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    // 押した瞬間の位置から「ふち」を動かす。指の横の移動量だけ、ふちが内／外へ動く
    const dx = Math.abs(e.clientX - cx) - Math.abs(p.x - cx);
    const y = Math.min(bottom, Math.max(top, e.clientY));
    push(y, rAt(y) + dx);
    p.x = e.clientX; p.y = e.clientY;
  });
  const up = e => pointers.delete(e.pointerId);
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);

  // ---- 描画 ----
  function render() {
    const cA = hex(preset.a), cB = hex(preset.b), pBG = pack(BG);
    // A と B の間の色の表（網点の境目をなめらかにするため）
    const mixC = [], mixP = new Uint32Array(MIXN);
    for (let i = 0; i < MIXN; i++) {
      const c = [0, 1, 2].map(j => Math.round(cA[j] + (cB[j] - cA[j]) * i / (MIXN - 1)));
      mixC.push(c); mixP[i] = pack(c);
    }
    const pitchPx = PITCH * S, fpy = 1 / pitchPx, colK = W * 0.2 / PITCH;  // colK: 1ラジアンあたりの列数
    const ca = Math.cos(preset.angle), sa = Math.sin(preset.angle);
    const lo = preset.lo, span = preset.hi - preset.lo;
    const cw = cv.width;

    // 前の形の範囲を背景で消す
    let maxR = 0; for (let i = 0; i < N; i++) maxR = Math.max(maxR, radius[i]);
    const box = { x0: Math.max(0, Math.floor((cx - maxR) * S) - 2), x1: Math.min(cw, Math.ceil((cx + maxR) * S) + 2),
                  y0: Math.max(0, Math.floor(top * S) - 1), y1: Math.min(cv.height, Math.ceil(bottom * S) + 1) };
    const clear = prevBox ? { x0: Math.min(box.x0, prevBox.x0), x1: Math.max(box.x1, prevBox.x1), y0: Math.min(box.y0, prevBox.y0), y1: Math.max(box.y1, prevBox.y1) } : box;
    for (let y = clear.y0; y < clear.y1; y++) buf.fill(pBG, y * cw + clear.x0, y * cw + clear.x1);

    const pcx = cx * S;
    for (let py = box.y0; py < box.y1; py++) {
      const yc = (py + 0.5) / S;
      if (yc < top || yc > bottom) continue;
      const r = rAt(yc) * S;
      const v = (yc - top) / (bottom - top) * 2 - 1;      // -1（上）〜 1（下）
      const x0 = Math.max(0, Math.floor(pcx - r - 1)), x1 = Math.min(cw, Math.ceil(pcx + r + 1));
      const row = py * cw;
      const r2 = r * r;
      for (let px = x0; px < x1; px++) {
        const dx = px + 0.5 - pcx;
        const cover = r - Math.abs(dx) + 0.5;               // ふちの1画素だけ半透明
        if (cover <= 0) continue;
        let u = dx / r;                                      // -1（左）〜 1（右）。輪郭に沿って曲がる
        if (u > 1) u = 1; else if (u < -1) u = -1;
        const th = ASIN[((u + 1) * 0.5 * (AN - 1)) | 0];     // 正面からの角度（回転体の表面）
        let t = 0.5 + 0.5 * (ca * u + sa * v) * 0.85;
        t = (t - lo) / span;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        // 網点: 表面に巻きついた格子（経線方向の列は回転で流れる）。濃いほど点が大きい
        const colF = (th + phase) * colK;
        const fx = (colF - Math.floor(colF)) * 2 - 1, ax = Math.abs(fx);
        const sq = r2 - dx * dx;
        // 行は少し上から見下ろした弧（手前ほど下がる）。回っている胴に見える
        const rowF = (py - TILT * Math.sqrt(sq > 0 ? sq : 0)) / pitchPx;
        const fy = (rowF - Math.floor(rowF)) * 2 - 1, ay = Math.abs(fy);
        // 1画素が格子の何マス分か（ふちに近いほど横に詰まる）
        const fpx = colK / Math.sqrt(sq > 0.25 ? sq : 0.25);
        const fp = fpx > fpy ? fpx : fpy;
        let m = t;                                           // 0 = A、1 = B。点が1画素より細かい所は平均の色
        if (fp < 0.5) {
          const spot = ax + ay <= 1 ? 1 - (fx * fx + fy * fy)
                                    : (ax - 1) * (ax - 1) + (ay - 1) * (ay - 1) - 1;  // 丸い網点（濃くなると反転してつながる）
          let d = (spot - THR[(t * (THRN - 1) + 0.5) | 0]) / (4 * fp) + 0.5;  // 境目を1画素ぶんだけなめらかに
          if (d < 0) d = 0; else if (d > 1) d = 1;
          // 点が細かくなるにつれて平均の色へ少しずつ移す（境目に線が出ないように）
          const k = fp < 0.25 ? 0 : (fp - 0.25) * 4;
          m = d + (t - d) * k;
        }
        const k = (m * (MIXN - 1) + 0.5) | 0;
        if (cover >= 1) buf[row + px] = mixP[k];
        else {
          const c = mixC[k];
          buf[row + px] = pack([0, 1, 2].map(j => Math.round(BG[j] + (c[j] - BG[j]) * cover)));
        }
      }
    }
    ctx.putImageData(img, 0, 0, clear.x0, clear.y0, clear.x1 - clear.x0, clear.y1 - clear.y0);
    prevBox = box;
  }

  function frame(now) {
    const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0;
    lastT = now;
    phase += dt * SPIN;                                       // 折り返さない（折り返すと網点の模様が飛ぶ）。いつも回っているので毎フレーム描く
    render(); dirty = false;
    requestAnimationFrame(frame);
  }

  // ---- 色の切り替え（試作用） ----
  const sw = document.getElementById('swatches');
  PRESETS.forEach(p => {
    const b = document.createElement('button');
    b.style.background = `linear-gradient(135deg, ${p.a} 50%, ${p.b} 50%)`;
    b.setAttribute('aria-label', '色');
    b.onclick = () => { preset = p; dirty = true; mark(); };
    sw.appendChild(b);
  });
  function mark() { [...sw.children].forEach((b, i) => b.classList.toggle('on', PRESETS[i] === preset)); }
  mark();

  addEventListener('resize', layout);
  layout();
  requestAnimationFrame(frame);
  window.__pot = { radius, get top() { return top; }, get bottom() { return bottom; }, get cx() { return cx; } };
})();
</script>
</body>
</html>
